
<div class="container-fluid px-2 px-md-3 px-xxl-4 py-4 py-lg-5">

  <!-- Page heading -->
  <app-page-heading
    title="My account"
    subtitle="Your account details" />

  <!-- API error -->
  <app-notice [message]="error()" />

  <!-- Loading state -->
  @if (loading()) {

    <div class="text-center text-secondary py-5"
         role="status">

      <span class="spinner-border spinner-border-sm me-2"
            aria-hidden="true"></span>

      Loading account details...

    </div>

  } @else if (user(); as profile) {

    <div class="row">

      <div class="col-12 col-lg-10 col-xl-8">

        <section class="card border-0 shadow-sm rounded-4 overflow-hidden"
                 aria-labelledby="profileHeading">

          <!-- Profile header -->
          <div class="card-header bg-dark text-white p-4">

            <div class="d-flex align-items-center gap-3">

              <span class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center p-3 fw-bold fs-4">

                {{ initials() }}

              </span>

              <div>

                <h2 class="h4 fw-bold mb-1"
                    id="profileHeading">

                  {{ profile.fullName }}

                </h2>

                <span class="badge text-bg-primary">

                  {{ roleLabel(profile.role) }}

                </span>

              </div>

            </div>

          </div>

          <!-- Actual account information -->
          <div class="card-body p-4">

            <dl class="row mb-0 gy-3">

              <!-- User ID -->
              <dt class="col-sm-4 text-secondary fw-medium">
                User ID
              </dt>

              <dd class="col-sm-8 fw-semibold mb-0">

                {{ profile.userId }}

              </dd>

              <!-- Full name -->
              <dt class="col-sm-4 text-secondary fw-medium">
                Full name
              </dt>

              <dd class="col-sm-8 fw-semibold mb-0">

                {{ profile.fullName }}

              </dd>

              <!-- Email -->
              <dt class="col-sm-4 text-secondary fw-medium">
                Email address
              </dt>

              <dd class="col-sm-8 fw-semibold text-break mb-0">

                {{ profile.email }}

              </dd>

              <!-- Role -->
              <dt class="col-sm-4 text-secondary fw-medium">
                Role
              </dt>

              <dd class="col-sm-8 fw-semibold mb-0">

                {{ roleLabel(profile.role) }}

              </dd>

            </dl>

          </div>

        </section>

      </div>

    </div>

  }

</div>
