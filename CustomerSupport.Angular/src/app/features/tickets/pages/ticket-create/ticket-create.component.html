<div class="row justify-content-center"><div class="col-xl-9"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h2 fw-bold mb-1">Create support ticket</h1><p class="text-secondary mb-0">Tell us which product needs attention and describe your issue.</p></div><a routerLink="/tickets/my" class="btn btn-outline-secondary">My tickets</a></div>
<div class="card shadow-sm border-0 rounded-4"><div class="card-body p-4 p-lg-5"><app-notice [message]="error()" />
  <form #form="ngForm" (ngSubmit)="submit()"><h2 class="h5 fw-bold mb-3"><span class="text-primary me-2">01</span>Request details</h2><div class="row g-3">
    <div class="col-md-6"><label for="product" class="form-label fw-semibold">Product</label><select id="product" name="product" class="form-select" required [(ngModel)]="model.productId"><option [ngValue]="0" disabled>Select product</option>@for (p of products();track p.id) {<option [ngValue]="p.id">{{p.name}}</option>}</select></div>
    <div class="col-md-6"><label for="category" class="form-label fw-semibold">Category (optional)</label><select id="category" name="category" class="form-select" [(ngModel)]="model.categoryId"><option [ngValue]="null">Select category</option>@for (c of categories();track c.id) {<option [ngValue]="c.id">{{c.name}}</option>}</select></div>
    <div class="col-md-6"><label for="priority" class="form-label fw-semibold">Priority</label><select id="priority" name="priority" class="form-select" [(ngModel)]="model.priorityId" required>@for (x of priorities();track x.id) {<option [ngValue]="x.id">{{x.name}}</option>}</select></div>
  </div><hr class="my-4"><h2 class="h5 fw-bold mb-3"><span class="text-primary me-2">02</span>Describe the problem</h2>
  <div class="mb-3"><label for="subject" class="form-label fw-semibold">Subject</label><input id="subject" name="subject" class="form-control" placeholder="Briefly describe the issue" [(ngModel)]="model.subject" required minlength="5" maxlength="200"></div>
  <div class="mb-4"><label for="description" class="form-label fw-semibold">Description</label><textarea id="description" name="description" class="form-control" rows="7" placeholder="What happened? What did you expect?" [(ngModel)]="model.description" required minlength="10" maxlength="5000"></textarea></div>
  <div class="d-flex justify-content-end gap-2"><a routerLink="/tickets/my" class="btn btn-outline-secondary">Cancel</a><button type="submit" class="btn btn-primary px-4" [disabled]="saving() || loading() || form.invalid || !model.productId"><i class="bi bi-send me-2"></i>{{saving()?'Submitting...':'Submit ticket'}}</button></div>
</form></div></div></div></div>
