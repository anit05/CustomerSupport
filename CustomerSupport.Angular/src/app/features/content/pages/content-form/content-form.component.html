<div class="row"><div class="col-lg-9 col-xl-7"><a [routerLink]="backUrl" class="small text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to {{type==='faqs'?'FAQs':'knowledge base'}}</a><h1 class="h2 fw-bold my-3">{{editing?'Edit':'Create'}} {{type==='faqs'?'FAQ':'article'}}</h1>
<div class="card shadow-sm border-0 rounded-4"><div class="card-body p-4 p-lg-5"><app-notice [message]="error()" />
<form #form="ngForm" (ngSubmit)="save()"><div class="mb-3"><label class="form-label fw-semibold" for="title">{{type==='faqs'?'Question':'Article title'}}</label><input id="title" name="title" class="form-control" required minlength="5" [(ngModel)]="title"></div>
<div class="mb-3"><label class="form-label fw-semibold" for="content">{{type==='faqs'?'Answer':'Content'}}</label><textarea id="content" name="content" class="form-control" rows="8" required minlength="5" [(ngModel)]="content"></textarea></div>
<div class="mb-3"><label class="form-label fw-semibold" for="product">Related product (optional)</label><select id="product" name="product" class="form-select" [(ngModel)]="productId"><option [ngValue]="null">All products</option>@for (p of products();track p.id) {<option [ngValue]="p.id">{{p.name}}</option>}</select></div>
@if (type === 'knowledge-base') {<div class="form-check form-switch mb-3"><input id="published" name="published" class="form-check-input" type="checkbox" [(ngModel)]="isPublished"><label for="published" class="form-check-label">Published</label></div>}
@if (editing) {<div class="form-check form-switch mb-4"><input id="active" name="active" class="form-check-input" type="checkbox" [(ngModel)]="isActive"><label for="active" class="form-check-label">Active</label></div>}
<button class="btn btn-primary px-4" type="submit" [disabled]="loading() || saving() || form.invalid">{{saving()?'Saving...':editing?'Save changes':type==='faqs'?'Create FAQ':'Create article'}}</button><a class="btn btn-outline-secondary ms-2" [routerLink]="backUrl">Cancel</a>
</form>
@if (editing) {<hr class="my-4"><button type="button" class="btn btn-outline-danger" [disabled]="saving()" (click)="deactivate()">Deactivate {{type==='faqs'?'FAQ':'article'}}</button>}
</div></div></div></div>
