
<section class="container py-3 py-md-4"
         aria-labelledby="loginHeading">

  <div class="row justify-content-center">

    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

      <div class="card border-0 shadow-sm rounded-4 overflow-hidden">

        <div class="card-body p-4 p-md-5">

          <!-- Login heading -->
          <div class="text-center mb-4">

            <span class="d-inline-flex align-items-center justify-content-center rounded-3 bg-primary-subtle text-primary p-3 mb-3">

              <i class="bi bi-person-lock fs-3"
                 aria-hidden="true"></i>

            </span>

            <h1 class="h3 fw-bold mb-2"
                id="loginHeading">
              Sign in
            </h1>

            <p class="text-secondary small mb-0">
              Sign in with your Customer Support account.
            </p>

          </div>

          <!-- API errors -->
          <app-notice [message]="error()" />

          <!-- Login form -->
          <form #form="ngForm"
                (ngSubmit)="submit()">

            <!-- Email -->
            <div class="mb-3">

              <label for="email"
                     class="form-label fw-semibold">
                Email address
              </label>

              <div class="input-group">

                <span class="input-group-text bg-body-tertiary">

                  <i class="bi bi-envelope"
                     aria-hidden="true"></i>

                </span>

                <input id="email"
                       name="email"
                       type="email"
                       class="form-control"
                       [(ngModel)]="email"
                       email
                       required
                       autocomplete="username"
                       placeholder="Enter your email address">

              </div>

            </div>

            <!-- Password -->
            <div class="mb-4">

              <label for="password"
                     class="form-label fw-semibold">
                Password
              </label>

              <div class="input-group">

                <span class="input-group-text bg-body-tertiary">

                  <i class="bi bi-lock"
                     aria-hidden="true"></i>

                </span>

                <input id="password"
                       name="password"
                       type="password"
                       class="form-control"
                       [(ngModel)]="password"
                       required
                       autocomplete="current-password"
                       placeholder="Enter your password">

              </div>

            </div>

            <!-- Sign in button -->
            <button type="submit"
                    class="btn btn-primary w-100 py-2 fw-semibold"
                    [disabled]="form.invalid || busy()">

              @if (busy()) {

                <span class="spinner-border spinner-border-sm me-2"
                      aria-hidden="true">
                </span>

                Signing in...

              } @else {

                <i class="bi bi-box-arrow-in-right me-2"
                   aria-hidden="true"></i>

                Sign in

              }

            </button>

          </form>

          <!-- Registration navigation -->
          <p class="text-center small text-secondary mt-4 mb-0">

            New customer?

            <a routerLink="/register"
               class="fw-semibold text-decoration-none">
              Create an account
            </a>

          </p>

        </div>

      </div>

    </div>

  </div>

</section>
